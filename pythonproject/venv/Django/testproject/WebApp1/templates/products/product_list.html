{%extends 'base.html' %}
{% load static %}
{% block content %}

    <div class="col-sm-10">
        <h1>Продукция, которая есть в наличии на складе</h1>

       {% for product in products %}
            <div>
                <a href="{{ product.product_price.get_absolute_url }}">
                    <img src="{% if product.product_price.image %}{{ product.product_price.image.url}}{% else %}{% static 'images/no_images.png' %}{% endif %}" width="100" height="100">
                </a>
                <a href="{{ product.product_price.get_absolute_url }}">{{ product.product_price.title }}</a><br>
                <p>код в прайс-листе {{product.id}}</p>

            </div>
            <br>
        {% endfor %}
    </div>

{% endblock %}
